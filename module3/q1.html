<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P10 Flexbox Header and Footer</title>
    <style>
        body{
    margin: 0;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    font-family:Arial, sans-serif;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    background-color:#333;
    color:white;
    padding:15px 20px;
}

.nav{
    display:flex;
    gap:15px;
}

 a{
    color: white;
    
}

.main{
    flex: 1;
    padding:20px;
}

.footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    background-color:#333;
    color: white;
    padding:15px 20px;
}

.links{
    display:flex;
    gap:15px;
}



    </style>
    
</head>
<body>

    <header class="header">
        <h2>My Portfolio</h2>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="main">
        <p>I am a student of BST interested in advance algorithms and enthusiantic to know about AI</p>
    </main>

    <footer class="footer">
        <p>Dibakar Das - 2026</p>
        <div class="links">
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
        </div>
    </footer>

</body>
</html>
