<!DOCTYPE html>
<html>
<head>
    <title>P11 Newspaper Layout</title>
    <style>
        body {
            font-family:Georgia, serif;
            margin:20px;
            background-color:#f9f9f9;
            color:#222;
        }

        .header {
            text-align:center;
            border-bottom:2px solid #222;
            margin-bottom:20px;
            padding-bottom:10px;
        }

        .newspaper {
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:20px;
        }

        .column {
            background-color:white;
            padding:15px;
            border:2px solid #ccc;
        }

        .h2 {
            margin-top:0;
            border-bottom:1px solid #222;
            padding-bottom:5px;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>The Daily News</h1>
        <p>Welcome to bharat news</p>
    </header>

    <main class="newspaper">
        <article class="column">
            <h2>Tech News</h2>
            <p>finally the quantum computer has been developed by google </p>
        </article>

        <article class="column">
            <h2>Disaster News</h2>
            <p>Punjab suffered a heavy flood today caused a death of many people</p>
        </article>

        <article class="column">
            <h2>Sports</h2>
            <p>India won the world cup match against Pakistan   yesterday.</p>
        </article>
    </main>

</body>
</html>
