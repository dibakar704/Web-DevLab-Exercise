<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P11 </title>
    <style>
        body {
            font-family:Georgia, serif;
            margin:20px;
            background-color:white;
            color:red;
        }

        .header {
            text-align:center;
            border-bottom:2px solid black;
            margin-bottom:20px;
            padding-bottom:10px;
        }

        .newspaper {
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:20px;
        }

        .column {
            background-color:white;
            padding:15px;
            border:2px solid black;
        }

        .h2 {
            margin-top:0;
            border-bottom:1px solid black;
            padding-bottom:5px;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>The Daily News</h1>
        <p>Welcome to bharat news</p>
    </header>

    <main class="newspaper">
        <article class="column">
            <h2>Tech News</h2>
            <p>finally the quantum computer has been developed by google </p>
        </article>

        <article class="column">
            <h2>Disaster News</h2>
            <p>Punjab suffered a heavy flood today caused a death of many people</p>
        </article>

        <article class="column">
            <h2>Sports</h2>
            <p>India won the world cup match against Pakistan   yesterday.</p>
        </article>
    </main>

</body>
</html>
